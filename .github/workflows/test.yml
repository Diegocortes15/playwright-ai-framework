name: Playwright Tests

on:
  pull_request:
    branches: [main, e2e-jira-from-issues]
  push:
    branches: [main, e2e-jira-from-issues]

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  playwright:
    name: Playwright matrix
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: write # allow the merge-time job to commit the refreshed qase-map.json back
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0 # full history so the PR step can diff changed spec files against the base

      - uses: actions/setup-node@v6
        with:
          node-version: '22'
          cache: 'npm'

      - run: npm ci

      # Static gates — run on the WHOLE codebase before the (narrow) test run, so a
      # type error or lint violation in a non-spec file (Page Object, fixture,
      # component) is caught even when a PR only runs a few changed spec files.
      # Fail fast, before the expensive browser install.
      - name: Typecheck
        run: npm run typecheck

      - name: Lint
        run: npm run lint

      # A documented command that cannot run is a broken instruction, and nothing executes
      # documentation — this is how /scaffold-page-object told three months of runs to invoke a
      # binary that is not on PATH.
      - name: Lint documented commands
        run: npm run lint:docs

      # Configuration files are read by no linter, so a decision recorded about one can be
      # reversed by accident and leave no trace.
      - name: Lint ADR invariants
        run: npm run lint:adr

      # Formatting drifts silently without a gate: four files sat unformatted on main for
      # months because nothing checked. `.observations/` is excluded in .prettierignore —
      # it is machine-written, not source.
      # Tests of the FRAMEWORK, not of the application: the Qase mirror, the exit-code rule,
      # the observation signatures, the report annotations. They live in src/ under their own
      # config, so they never share an invocation with the specs in tests/ — `npm test`
      # resolves zero of them.
      #
      # Pull requests only, and on purpose. A `pull_request` run checks out the MERGE commit
      # (refs/pull/N/merge), so this already tests the merged result; re-running it on push
      # would re-test the same tree. They cost under two seconds, which is why they sit beside
      # the linters rather than behind a scoping rule.
      #
      # They are here because the two defects found on 2026-09-14 were both in this code and
      # invisible to every Playwright test of saucedemo: run-and-report.ts swallowed the test
      # run's exit code, and report-annotations.ts silently produced nothing.
      - name: Unit tests (framework)
        if: ${{ github.event_name == 'pull_request' }}
        run: npm run test:unit

      - name: Format check
        run: npm run format:check

      - name: Cache Playwright browsers
        uses: actions/cache@v6
        with:
          path: ~/.cache/ms-playwright
          key: pw-${{ runner.os }}-${{ hashFiles('package-lock.json') }}

      # Chromium only — the suite is chromium-only (projects use Desktop Chrome; no
      # firefox/webkit). Installing all three pulled in huge OS deps that timed the
      # job out; chromium's deps are largely pre-installed on the runner.
      - run: npx playwright install --with-deps chromium

      # On a PR: run ONLY the spec files this PR added/modified — "the PR's tests, no
      # more". We deliberately do NOT use `--only-changed`: it follows the import graph,
      # so touching a shared file (e.g. src/fixtures/test.ts, which every spec imports)
      # drags in the whole suite — which is exactly the scaling pain we're avoiding.
      # Changing a shared Page Object therefore won't re-run its OTHER dependents here;
      # the full suite on merge (below) is the integration gate that catches that.
      # PR tier: the smoke set plus whatever specs this PR changed. Deliberately NOT a
      # computed "affected" set — see ADR-0032. Smoke is 8 tests and ~6s, selected by
      # user-visible risk (smoke-policy.md), and the broad net lives at merge below.
      #
      # Smoke runs FIRST so a critical-path regression stops the step before anything else,
      # and so the HTML report left behind belongs to whichever run failed.
      - name: Run smoke (pull request)
        if: ${{ github.event_name == 'pull_request' }}
        env:
          SAUCEDEMO_PASSWORD: ${{ secrets.SAUCEDEMO_PASSWORD }}
          CI: 'true'
        run: npx playwright test --grep "@smoke"

      - name: Run the specs this PR changed (pull request)
        if: ${{ github.event_name == 'pull_request' }}
        env:
          SAUCEDEMO_PASSWORD: ${{ secrets.SAUCEDEMO_PASSWORD }}
          CI: 'true'
        run: |
          base="${{ github.event.pull_request.base.sha }}"
          changed=$(git diff --name-only --diff-filter=AMR "$base"...HEAD -- 'tests/' | grep '\.spec\.ts$' || true)
          if [ -z "$changed" ]; then
            echo "No spec files added or modified — smoke above is the whole PR tier."
            exit 0
          fi
          echo "Changed specs:"
          echo "$changed"
          # shellcheck disable=SC2086 # deliberate word-splitting into separate paths
          npx playwright test $changed

      - name: Run full suite (merge)
        if: ${{ github.event_name == 'push' }}
        env:
          SAUCEDEMO_PASSWORD: ${{ secrets.SAUCEDEMO_PASSWORD }}
          CI: 'true'
        run: npm test

      # Catalog sync at merge (push only): create/update/archive Qase cases. No run.
      - name: Sync test cases to Qase (merge only)
        if: ${{ always() && github.event_name == 'push' }}
        env:
          QASE_API_TOKEN: ${{ secrets.QASE_API_TOKEN }}
          QASE_PROJECT_CODE: ${{ secrets.QASE_PROJECT_CODE }}
        run: npm run tcms:sync

      # Commit the refreshed qase-map.json back so the committed map always reflects
      # the live Qase case ids (e.g. after a /from-issue PR adds new cases). The
      # `[skip ci]` tag stops this bot commit from re-triggering the workflow.
      - name: Commit refreshed qase-map.json (merge only)
        if: ${{ always() && github.event_name == 'push' }}
        run: |
          if [ -n "$(git status --porcelain qase-map.json)" ]; then
            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git add qase-map.json
            git commit -m "chore(tcms): refresh qase-map.json [skip ci]"
            git push origin "HEAD:${{ github.ref_name }}"
          else
            echo "qase-map.json unchanged — nothing to commit."
          fi

      # Whoever downloads this zip by hand will double-click index.html and find every
      # trace, video and screenshot missing: the summary is inlined as base64, but those
      # are fetched from data/, and a browser blocks fetch over file://. Ship the fix
      # inside the artifact, the way /report-bug's evidence folder carries a README.txt.
      - name: Explain how to open the report
        if: ${{ !cancelled() && hashFiles('playwright-report/index.html') != '' }}
        run: |
          cat > playwright-report/HOW-TO-OPEN.txt <<'TXT'
          Do NOT double-click index.html.

          The summary will load, but every trace, video and screenshot will be missing.
          They are fetched from data/, and a browser blocks fetch over file://.

          Serve the report instead, from the folder this file is in:

              npx playwright show-report .

          Any static HTTP server works too:

              python3 -m http.server

          then open the URL it prints.
          TXT

      - name: Upload HTML report (always)
        if: ${{ !cancelled() }}
        uses: actions/upload-artifact@v7
        with:
          name: playwright-report
          path: playwright-report/
          retention-days: 7
          # A PR that changes no spec files runs no tests → no report to upload;
          # skip quietly instead of warning.
          if-no-files-found: ignore
