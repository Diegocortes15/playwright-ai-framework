name: Regression & Smoke (scheduled + manual)

# Names the run in the Actions UI: automated (scheduled, smoke vs regression) vs
# manual + who triggered it. The smoke cron is '0 5 * * *'; anything else scheduled
# is the regression cron.
run-name: ${{ github.event_name == 'schedule' && (github.event.schedule == '0 5 * * *' && 'Automated · smoke · chromium' || 'Automated · regression · chromium') || format('Manual · {0} · {1} — @{2}', inputs.suite, inputs.browser, github.triggering_actor) }}

on:
  # Two scheduled cadences, both gated below (crons are UTC; Bogota = UTC−5):
  #  • Smoke      — 05:00 UTC = 00:00 Bogota (midnight). Daily cron, gated to EVERY
  #                 OTHER DAY, anchored on 2026-07-02 → Jul 2, 4, 6, 8, …
  #  • Regression — Mon 04:00 UTC = Sun 23:00 Bogota (the night before, so it's ready
  #                 Monday morning). Gated to every OTHER Monday, anchored on
  #                 2026-07-13 → Jul 13, 27, Aug 10, …
  schedule:
    - cron: '0 5 * * *' # smoke — every other day (see gate)
    - cron: '0 4 * * 1' # regression — biweekly, Sun 23:00 Bogota (see gate)
  # Run on demand: Actions tab → this workflow → "Run workflow" → pick the suite.
  workflow_dispatch:
    inputs:
      suite:
        description: 'Suite to run'
        type: choice
        options:
          - regression
          - smoke
        default: regression
      # Scheduled runs are always chromium: the cadences exist to catch regressions in the
      # app, and re-running them on three engines triples the minutes to re-check the same
      # application. Engine differences are worth a deliberate look, not a nightly one, so
      # this is the QA's lever rather than the calendar's (ADR-0027).
      browser:
        description: 'Browser engine (scheduled runs are always chromium)'
        type: choice
        options:
          - chromium
          - firefox
          - webkit
          - all
        default: chromium

permissions:
  contents: read

jobs:
  gate:
    name: Decide whether to run
    runs-on: ubuntu-latest
    outputs:
      run: ${{ steps.check.outputs.run }}
      suite: ${{ steps.check.outputs.suite }}
      browser: ${{ steps.check.outputs.browser }}
    steps:
      - id: check
        env:
          EVENT: ${{ github.event_name }}
          SCHEDULE: ${{ github.event.schedule }}
          INPUT_SUITE: ${{ inputs.suite }}
          INPUT_BROWSER: ${{ inputs.browser }}
        run: |
          today=$(date -u -d "$(date -u +%F)" +%s)
          # Only a manual run may choose an engine. Written as an explicit branch rather
          # than leaning on a schedule's empty input, so the pin is visible and cannot be
          # undone by someone giving the input a different default (ADR-0029).
          # scripts/run-suite.sh refuses the combination too, with exit 66, which is the
          # gate that holds if this line is ever edited.
          if [ "$EVENT" = "workflow_dispatch" ]; then
            echo "browser=${INPUT_BROWSER:-chromium}" >> "$GITHUB_OUTPUT"
          else
            echo "browser=chromium" >> "$GITHUB_OUTPUT"
          fi
          if [ "$EVENT" = "workflow_dispatch" ]; then
            echo "Manual run — suite=$INPUT_SUITE, browser=${INPUT_BROWSER:-chromium}."
            echo "run=true" >> "$GITHUB_OUTPUT"
            echo "suite=$INPUT_SUITE" >> "$GITHUB_OUTPUT"
          elif [ "$SCHEDULE" = "0 5 * * *" ]; then
            # Smoke: every other day. Anchored on 2026-07-02, so an even number of whole
            # days since the anchor = an "on" day. (05:00 UTC = 00:00 Bogota / midnight.)
            anchor=$(date -u -d '2026-07-02' +%s)
            days=$(( (today - anchor) / 86400 ))
            echo "suite=smoke" >> "$GITHUB_OUTPUT"
            if [ $((days % 2)) -eq 0 ]; then
              echo "On-cadence (day $days from 2026-07-02) — running smoke."
              echo "run=true" >> "$GITHUB_OUTPUT"
            else
              echo "Off-cadence (day $days from 2026-07-02) — skipping tonight."
              echo "run=false" >> "$GITHUB_OUTPUT"
            fi
          else
            # Regression: every other Monday. Anchored on 2026-07-13 (a Monday), so an
            # even number of whole weeks since the anchor = an "on" week. The cron fires
            # Mon 04:00 UTC = Sun 23:00 Bogota, but the UTC date is still that Monday.
            anchor=$(date -u -d '2026-07-13' +%s)
            weeks=$(( (today - anchor) / 604800 ))
            echo "suite=regression" >> "$GITHUB_OUTPUT"
            if [ $((weeks % 2)) -eq 0 ]; then
              echo "On-cadence (week $weeks from 2026-07-13) — running regression."
              echo "run=true" >> "$GITHUB_OUTPUT"
            else
              echo "Off-cadence (week $weeks from 2026-07-13) — skipping this Monday."
              echo "run=false" >> "$GITHUB_OUTPUT"
            fi
          fi

  run-suite:
    name: Run suite
    needs: gate
    if: needs.gate.outputs.run == 'true'
    runs-on: ubuntu-latest
    # `all` runs every chromium project plus the four cross-browser ones — 239 tests against
    # chromium's 83 — and CI retries twice. 20 minutes was sized for chromium alone.
    timeout-minutes: ${{ needs.gate.outputs.browser == 'all' && 60 || (needs.gate.outputs.browser == 'chromium' && 20 || 40) }}
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v6
        with:
          node-version: '22'
          cache: 'npm'

      - run: npm ci

      - name: Cache Playwright browsers
        uses: actions/cache@v6
        with:
          path: ~/.cache/ms-playwright
          # The engine selection is part of the key: with a single key, the first
          # chromium-only run populates the cache and every later Firefox run gets a cache
          # HIT and then downloads Firefox anyway, forever, because actions/cache only saves
          # on a miss.
          key: pw-${{ runner.os }}-${{ hashFiles('package-lock.json') }}-${{ needs.gate.outputs.browser }}

      # Chromium is installed unconditionally, even for a Firefox or WebKit run: the
      # `setup-<user>` projects declare no `use`, so they authenticate on Playwright's
      # default engine, and `firefox-standard` depends on `setup-standard`. A WebKit run
      # that installed only WebKit dies in its dependency.
      - name: Install browsers (${{ needs.gate.outputs.browser }})
        env:
          BROWSER: ${{ needs.gate.outputs.browser }}
        run: |
          case "$BROWSER" in
            chromium) engines="chromium" ;;
            firefox) engines="chromium firefox" ;;
            webkit) engines="chromium webkit" ;;
            all) engines="chromium firefox webkit" ;;
            *) echo "Unknown browser '$BROWSER'." >&2; exit 1 ;;
          esac
          echo "Installing: $engines"
          # shellcheck disable=SC2086 # deliberate word-splitting into separate arguments
          npx playwright install --with-deps $engines

      # Runs the chosen suite AND records a labeled Qase run ("REGRESSION …" / "SMOKE …");
      # the Qase run URL is printed in this step's log.
      - name: Run ${{ needs.gate.outputs.suite }} on ${{ needs.gate.outputs.browser }} + record a Qase run
        id: run
        env:
          SAUCEDEMO_PASSWORD: ${{ secrets.SAUCEDEMO_PASSWORD }}
          QASE_API_TOKEN: ${{ secrets.QASE_API_TOKEN }}
          QASE_PROJECT_CODE: ${{ secrets.QASE_PROJECT_CODE }}
          CI: 'true'
        # One script holds the engine → project mapping, so what CI runs and what a QA runs
        # locally cannot drift. It also exports RUN_ENGINES, which is how the Qase record and
        # the Slack line name the real engine instead of assuming Chromium.
        run: bash scripts/run-suite.sh "${{ needs.gate.outputs.suite }}" "${{ needs.gate.outputs.browser }}"

      # Runtime observations (ADR-0021) — things the app did that no test asserted on.
      # Uploaded, never committed: a nightly commit-back would churn main every day.
      - name: Upload observations (always)
        if: ${{ !cancelled() && hashFiles('.observations/*.json') != '' }}
        uses: actions/upload-artifact@v7
        with:
          name: observations-${{ needs.gate.outputs.suite }}-${{ needs.gate.outputs.browser }}
          path: .observations/

      # Whoever downloads this zip by hand will double-click index.html and find every
      # trace, video and screenshot missing: the summary is inlined as base64, but those
      # are fetched from data/, and a browser blocks fetch over file://. Ship the fix
      # inside the artifact, the way /report-bug's evidence folder carries a README.txt.
      - name: Explain how to open the report
        if: ${{ !cancelled() && hashFiles('playwright-report/index.html') != '' }}
        run: |
          cat > playwright-report/HOW-TO-OPEN.txt <<'TXT'
          Do NOT double-click index.html.

          The summary will load, but every trace, video and screenshot will be missing.
          They are fetched from data/, and a browser blocks fetch over file://.

          Serve the report instead, from the folder this file is in:

              npx playwright show-report .

          Any static HTTP server works too:

              python3 -m http.server

          then open the URL it prints.
          TXT

      - name: Upload HTML report (always)
        if: ${{ !cancelled() }}
        uses: actions/upload-artifact@v7
        with:
          name: playwright-report-${{ needs.gate.outputs.suite }}-${{ needs.gate.outputs.browser }}
          path: playwright-report/
          retention-days: 14
          if-no-files-found: ignore

      # The environment this run executed on (OS · Chromium · Node · Playwright),
      # captured with no browser launch — same source as the report metadata + Qase.
      - name: Capture environment
        id: env
        if: ${{ !cancelled() }}
        env:
          BROWSER: ${{ needs.gate.outputs.browser }}
        run: |
          case "$BROWSER" in
            all) engines="chromium firefox webkit" ;;
            *) engines="$BROWSER" ;;
          esac
          # shellcheck disable=SC2086 # deliberate word-splitting into separate arguments
          echo "line=$(npx tsx src/utils/run-environment.ts $engines)" >> "$GITHUB_OUTPUT"

      # Post the outcome to Slack: pass/fail + counts, run duration, the environment,
      # the Qase run link, the GitHub run link (→ report artifact), and the
      # automated/manual + who identifier.
      - name: Notify Slack
        if: ${{ !cancelled() }}
        env:
          SLACK_WEBHOOK_URL: ${{ secrets.SLACK_WEBHOOK_URL }}
          RESULT: ${{ steps.run.outcome }}
          SUITE: ${{ needs.gate.outputs.suite }}
          BROWSER: ${{ needs.gate.outputs.browser }}
          QASE_RUN_URL: ${{ steps.run.outputs.qase_run_url }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
          RUN_ID: ${{ github.run_id }}
          EVENT_NAME: ${{ github.event_name }}
          ACTOR: ${{ github.triggering_actor }}
          BRANCH: ${{ github.ref_name }}
          ENV_LINE: ${{ steps.env.outputs.line }}
        run: |
          if [ -z "$SLACK_WEBHOOK_URL" ]; then echo "No SLACK_WEBHOOK_URL secret — skipping Slack."; exit 0; fi
          counts=""
          dur=""
          if [ -f test-results/results.json ]; then
            counts=$(jq -r '.stats | ":check-mark-button: \(.expected) passed · :cross-mark: \(.unexpected) failed" + (if .flaky>0 then " · ⚠️ \(.flaky) flaky" else "" end) + (if .skipped>0 then " · ⏭️ \(.skipped) skipped" else "" end)' test-results/results.json 2>/dev/null || true)
            secs=$(jq -r '(.stats.duration // 0)/1000|floor' test-results/results.json 2>/dev/null || echo 0)
            if [ "$secs" -ge 60 ]; then dur="$((secs/60))m $((secs%60))s"; else dur="${secs}s"; fi
          fi
          # icon → unicode for the notification/fallback text; mark → custom emoji for the in-channel body.
          # Title Case throughout, including the verb. The red cross already carries the alarm,
          # so shouting FAILED adds volume rather than information, and a channel that shouts
          # reads as an alert feed instead of a report.
          if [ "$RESULT" = "success" ]; then icon="✅"; mark=":check-mark-button:"; verb="Passed"; else icon="❌"; mark=":cross-mark:"; verb="Failed"; fi
          if [ "$EVENT_NAME" = "schedule" ]; then who=":robot: Automated (scheduled)"; else who=":scientist-2: Manual by @$ACTOR"; fi
          # Which branch this ran against. A dispatch can pick any branch in the "Use workflow
          # from" dropdown, and the result means something different depending on the answer —
          # a red run on a feature branch is expected, the same red on main is an incident.
          # Written as text rather than an emoji, so it renders in any workspace.
          [ -n "$BRANCH" ] && who="$who · branch \`$BRANCH\`"
          case "$SUITE" in
            smoke) suite_name='Smoke' ;;
            regression) suite_name='Regression' ;;
            *) suite_name="$SUITE" ;;
          esac
          # The engine belongs in the headline, not buried in the environment line: someone
          # scanning the channel needs to know at a glance that the failure is WebKit-only.
          # It is carried TWICE on purpose — a workspace emoji and the product's own name —
          # because an emoji that fails to render, or a reader who does not know the icons,
          # would otherwise lose the fact entirely. Chromium is named like the rest even
          # though it is the default: a reader should never have to know what the absence
          # of a word means.
          case "$BROWSER" in
            chromium) engine=':chrome:'; engine_text=' (Chromium)' ;;
            firefox) engine=':firefox:'; engine_text=' (Firefox)' ;;
            webkit) engine=':webkit:'; engine_text=' (WebKit)' ;;
            all) engine=':chrome::firefox::webkit:'; engine_text=' (All)' ;;
            *) engine=''; engine_text=" ($BROWSER)" ;;
          esac
          body="*$mark $engine $suite_name$engine_text $verb*"$'\n'"$who"
          [ -n "$counts" ] && body="$body"$'\n'"$counts"
          [ -n "$dur" ] && body="$body"$'\n'":stopwatch-2: Ran in $dur"
          [ -n "$ENV_LINE" ] && body="$body"$'\n'":performing-arts: $ENV_LINE"
          # Custom emoji outside the <url|label> so Slack renders them (emoji inside link text don't render).
          [ -n "$QASE_RUN_URL" ] && body="$body"$'\n'":qase: <$QASE_RUN_URL|Qase run>"
          # Observations: a COUNT plus where to look. Dumping the contents here is how
          # a channel gets muted — the detail lives in the uploaded artifact (ADR-0021).
          if ls .observations/*.json >/dev/null 2>&1; then
            total=$(jq -s '[.[].observations[]] | length' .observations/*.json 2>/dev/null || echo 0)
            firstparty=$(jq -s '[.[].observations[] | select(.thirdParty == false)] | length' .observations/*.json 2>/dev/null || echo 0)
            if [ "${total:-0}" -gt 0 ]; then
              body="$body"$'\n'":magnifying-glass-tilted-left: $total observations · $firstparty first-party"
            fi
          fi
          body="$body"$'\n'":github: <$RUN_URL|GitHub run & report artifact>"
          # Getting from that link to an open report is the step people stall on: the
          # artifact is a zip, and it needs an HTTP server rather than a double-click.
          # Hand over the exact command with the run id already filled in. It needs the
          # gh CLI; without gh, download the zip from the run page above and follow the
          # HOW-TO-OPEN.txt inside it.
          body="$body"$'\n'":inbox-tray: Open it (needs \`gh\`): \`gh run download $RUN_ID -n playwright-report-$SUITE-$BROWSER -D /tmp/pw-$RUN_ID && npx playwright show-report /tmp/pw-$RUN_ID\`"
          jq -n --arg t "$icon $suite_name$engine_text $verb" --arg b "$body" '{text: $t, blocks: [{type: "section", text: {type: "mrkdwn", text: $b}}]}' | curl -sS -X POST -H 'Content-type: application/json' -d @- "$SLACK_WEBHOOK_URL"
